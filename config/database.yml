# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: postgresql
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

sqlite: &sqlite
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  database: db/development.sqlite3

development:
  <<: *default
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DB_PORT") { 5432 } %>
  username: <%= ENV.fetch("DB_USER") {"postgres"} %>
  password: <%= ENV.fetch("DB_PASSWORD") {"postgres_password"} %>
  database: <%= ENV.fetch("DB_NAME") { "web_assessment" } %>_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  adapter: sqlite3
  database: storage/test.sqlite3
  pool: 5
  timeout: 5000

# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  primary:
    <<: *default
    host: <%= ENV.fetch("DB_HOST") { "web_assessment-db" } %>
    port: <%= ENV.fetch("POSTGRES_PORT") { 5432 } %>
    username: <%= ENV.fetch("POSTGRES_USER") {"cakravia-usr"} %>
    password: <%= ENV.fetch("POSTGRES_PASSWORD") {"postgres_password"} %>
    database: <%= ENV.fetch("POSTGRES_DB") { "web_assessment_production" } %>
  cache:
    <<: *sqlite
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *sqlite
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *sqlite
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
